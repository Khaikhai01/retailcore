<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duka POS</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>

    <!-- HEADER -->
    
    <header class="app-header">
        <div class="logo">
            <h1>Duka POS</h1>
            <p>Point of Sale & Stock Manager</p>
        </div>

        <div class="header-actions">
            <span id="current-data"></span>
            <button id="cart-toggle" type="button">
                View Cart
                <span id="cart-count">0</span>
            </button>
        </div>
    </header>

    
    <!-- Main Content -->
     <main class="app-container">
        <!-- Products section -->
         <section class="products-panel" id="products-section">
            
            <div class="section-header">
                <h2>Products</h2>
                <p>Select Products to add to your cart.</p>
            </div>

            <!-- Product Search -->

            <div class="product-search">
                <label for="product-search">Search Products</label>

                <input 
                    type="search" 
                    id="product-search"
                    placeholder="search by product name..."
                    autocomplete="off"
                >
            </div>

            <!-- Filters Category -->

            <nav class="category-filters" id="category-filters" aria-label="Product categories"></nav>
            <div class="product-grid" id="product-grid"></div>
         </section>

         <!-- Cart Panel -->

         <aside class="cart-panel" id="cart-section">

            <div class="section-header">
                <div>
                    <h2>Shopping Cart</h2>
                    <p id="cart-message">Your Cart is empty</p>
                </div>

                <button id="clear-cart" type="button">
                    Clear Cart
                </button>
            </div>

            <!-- Cart Items -->

            <div class="cart-items" id="cart-items"></div>

            <!-- Cart Summary -->

            <div class="cart-summary">

                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="cart-subtotal">KSH 0.00</span>
                </div>

                <div class="summary-row" id="total-row">
                    <strong>Total</strong>
                    <strong id="cart-total">KSH 0.00</strong>
                </div>

                <button id="checkout-btn" type="button" disabled>
                    Complete Sale
                </button>

            </div>
         </aside>
     </main>

    <script src="src/app.js"></script>
</body>
</html>
